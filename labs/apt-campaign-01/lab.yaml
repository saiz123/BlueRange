scenario: |
  SIEM correlated events across 4 systems over a 6-hour window and fired a critical
  multi-stage intrusion alert at 19:45 UTC. Starting at 13:30 UTC, CFO assistant
  awalker received a spearphishing email with a macro-enabled Word document. By 19:45,
  the attacker had achieved initial access, established C2, dumped credentials, moved
  laterally to the finance server, and was actively exfiltrating data.

  You have logs from email, endpoint, network, and AD. Reconstruct the full attack
  timeline and document the complete kill chain.

