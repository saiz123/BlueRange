scenario: |
  At 11:33 UTC, SIEM detected a root shell spawn on LINUX-DEV-03 (10.0.5.14) by user
  devuser (UID 1002), a developer with no admin privileges. The process tree shows
  bash → sudo vim → !/bin/bash, a known GTFOBins technique for escaping restricted
  environments. A new local user "backdoor-user" was created immediately after.

  Investigate the logs to confirm the attack chain and scope of compromise.

