{{template "base" .}}
{{define "title"}}Audit Log — Admin{{end}}
{{define "content"}}
<div class="page-header">
  <div class="inv-breadcrumb"><a href="/admin">← Admin Panel</a></div>
  <h1>Audit Log</h1>
  <p class="page-sub">Last 200 recorded actions across all users.</p>
</div>

<div class="queue-table-wrap">
  <table class="admin-table">
    <thead>
      <tr><th>Time</th><th>User</th><th>Action</th><th>Target</th><th>IP</th></tr>
    </thead>
    <tbody>
      {{range .Entries}}
      <tr>
        <td class="mono" style="font-size:11px;color:var(--text-mute);white-space:nowrap">{{.CreatedAt.Format "Jan 2 15:04:05"}}</td>
        <td style="font-weight:600">{{.Username}}</td>
        <td><span class="category-tag">{{.Action}}</span></td>
        <td style="color:var(--text-mute);font-size:12px">{{.Target}}</td>
        <td class="mono" style="font-size:11px;color:var(--text-dim)">{{.IP}}</td>
      </tr>
      {{end}}
    </tbody>
  </table>
</div>
{{end}}
