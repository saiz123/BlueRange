{{template "base" .}}
{{define "title"}}Register — BlueRange{{end}}
{{define "content"}}
<div class="login-wrap">
  <div class="login-box">
    <div class="login-logo">&#9632; BlueRange</div>
    <h1 class="login-title">Create Account</h1>
    <p style="font-size:13px;color:var(--text-mute);margin-bottom:20px;text-align:center">You need an invite code to register.</p>
    {{if .Error}}
    <div class="login-error">{{.Error}}</div>
    {{end}}
    <form method="POST" action="/register" class="login-form">
      <div class="form-group">
        <label class="form-label">Invite Code</label>
        <input type="text" name="code" value="{{.Code}}" required placeholder="8-character code" class="mono" style="letter-spacing:2px">
      </div>
      <div class="form-group">
        <label class="form-label">Username</label>
        <input type="text" name="username" required autocomplete="username" placeholder="analyst_01">
      </div>
      <div class="form-group">
        <label class="form-label">Password <small style="color:var(--text-mute)">(8+ chars)</small></label>
        <input type="password" name="password" required autocomplete="new-password" minlength="8">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;margin-top:8px">Create Account</button>
    </form>
    <p style="font-size:12px;color:var(--text-mute);text-align:center;margin-top:16px">
      Already have an account? <a href="/login">Sign in</a>
    </p>
  </div>
</div>
{{end}}
