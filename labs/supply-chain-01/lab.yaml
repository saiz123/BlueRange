alert:
  severity: high
  source: proxy
  rule: Unexpected Outbound POST During npm install — Developer Workstation
  triggered_at: "2026-06-25T14:55:03Z"
  src_ip: "10.0.4.31"

scenario: |
  Proxy logs show WORKSTATION-DEV-09 (10.0.4.31, developer jkim) made an outbound
  POST to https://collect.malicious-stats[.]io during an npm install at 14:55 UTC.
  The request contained a base64 payload in the body. The package being installed was
  "react-date-utils" v2.3.1, which has 2.4M weekly downloads on npmjs.com.

  Investigation reveals the published package was recently updated. Your job is to
  determine whether this is a legitimate telemetry call or a compromised npm package
  exfiltrating developer credentials.

