alert:
  severity: high
  source: sysmon
  rule: Certutil Downloading Remote File + MSHTA Executing Remote Script
  triggered_at: "2026-06-25T16:22:44Z"
  src_ip: "10.0.1.42"

scenario: |
  Sysmon on WORKSTATION-05 (10.0.1.42) fired at 16:22 UTC when certutil.exe was
  observed downloading a file from an external URL, followed immediately by mshta.exe
  executing a remote HTA script. Both are Living-Off-the-Land binaries (LOLBins) —
  legitimate Windows tools being abused for payload delivery.

  The user on this workstation (lperez) clicked a link in an internal chat message
  claiming to be a meeting invite. Investigate the execution chain and assess scope.

