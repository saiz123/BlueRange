services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: bluerange:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data          # SQLite database (persists between restarts)
      - ./labs:/app/labs          # Lab content (hot-reload on restart)
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/login"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
