alert:
  severity: high
  source: cloudtrail
  rule: IAM Role Assumption from Unusual Geography + Privilege Escalation Chain
  triggered_at: "2026-06-25T08:47:33Z"
  src_ip: "185.233.102.47"

scenario: |
  AWS GuardDuty and CloudTrail forwarded a high-severity alert at 08:47 UTC. An IAM role
  (dev-deploy-role) was assumed by access keys belonging to developer jpark (James Park)
  from an IP in Bucharest, Romania (185.233.102.47). James Park is based in Austin, TX and
  has no travel scheduled. Within 3 minutes of assuming the role, the session enumerated
  all IAM users, created a new IAM user (backup-svc-acct), attached AdministratorAccess
  to the new user, and generated access keys for it.

  Determine whether this is an account compromise and whether escalation is warranted.

