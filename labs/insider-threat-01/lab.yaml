alert:
  severity: high
  source: ueba
  rule: Anomalous Volume of HR Record Access by Single User
  triggered_at: "2026-06-25T14:22:10Z"
  src_ip: "10.0.2.45"

scenario: |
  The UEBA platform fired on user account mwilson (Mary Wilson, HR Analyst) at 14:22 UTC.
  Over a 90-minute window, mwilson accessed 1,847 HR records — 40× her normal daily baseline.
  Simultaneously, a USB mass storage device was connected to her workstation (DESKTOP-HRA-03).
  HR has no ongoing project that would require bulk file access. Mary submitted her resignation
  two weeks ago and her last working day is Friday.

  Determine if this is malicious data exfiltration or a legitimate business activity.

