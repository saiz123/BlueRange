scenario: >
  The SIEM triggered on a rule detecting multiple failed Windows logon events
  (Event ID 4625) within a 5-minute window from the same source IP targeting
  multiple user accounts. The pattern is consistent with a password spray attack
  against the company's RDP gateway. Analyze the auth logs, determine if any
  accounts were compromised, and recommend the appropriate response.

