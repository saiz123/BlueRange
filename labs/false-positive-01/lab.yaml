  rule: SQL Injection Attempt Detected — Multiple Payloads
  triggered_at: "2026-06-25T09:15:00Z"
  src_ip: "10.0.0.200"

scenario: |
  An IDS rule fired at 09:15 UTC after detecting what appears to be multiple SQL
  injection payloads originating from internal IP 10.0.0.200 targeting the company's
  web application at 10.0.1.5. The source IP sent 847 requests in 4 minutes with
  user-agent "Nessus/10.4" and patterns matching common SQLi scanners.

  Review the IDS and web server logs to determine if this is a real attack or an
  authorized vulnerability scan. The security team does run weekly scans; check
  whether this falls within the approved maintenance window (Tuesday 09:00-10:00 UTC).

