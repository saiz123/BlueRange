scenario: >
  The SIEM correlation engine fired a high-severity alert tying together multiple
  events over the past 72 hours: a phishing email, a macro execution, C2 beaconing,
  credential dumping, lateral movement, and DNS-based exfiltration — all traceable
  to an initial phishing email received by john.doe@corp.local. You are the L1 analyst
  on duty. Your task is to build the complete attack timeline, identify all affected
  systems and accounts, classify each stage with MITRE techniques, and make a
  well-reasoned escalation decision.

